name: Bug report
description: The CLI or a generated repository does not behave as documented.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check existing issues first.
        Security vulnerabilities go to a private report instead: see SECURITY.md.
        For a command the guard should block (or should allow), use the "Guard bypass" form.
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran, including flags.
      placeholder: npx @artisanxl/create-monorepo my-app --apps api --scope @acme -y
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output, error message or the generated file that is wrong.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: create-monorepo version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (`node -v`), pnpm version (`pnpm -v`), shell.
      placeholder: macOS 15, Node 24.3.0, pnpm 12.21.0, zsh
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How was it run?
      options:
        - Interactive wizard
        - Flags only / -y / CI
        - Re-run on an existing repository
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Workarounds, related issues, a minimal repository that reproduces it.
