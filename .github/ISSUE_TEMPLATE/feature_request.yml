name: Feature request
description: Propose a new flag, component, template or guardrail.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem before the solution. Design decisions are recorded in
        `docs/adr/`; if your proposal changes one of them, say which.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How the CLI or the generated repository should behave. Include example commands or output.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: adr
    attributes:
      label: Related ADR
      description: e.g. ADR-0004 (selectable components), if any.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
