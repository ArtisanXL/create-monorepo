name: CI
on:
  push:
    branches: [main, "integration/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12"

jobs:
  test:
    name: Unit tests, typecheck, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm lint
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm test
        if: matrix.os == 'ubuntu-latest'
      - name: Golden output
        if: matrix.os != 'ubuntu-latest'
        run: pnpm vitest run test/golden.test.ts

  pack-smoke:
    name: Pack smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke:pack

  e2e:
    name: E2E scaffold + install + verify (${{ matrix.pm }}, ${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - pm: pnpm
            runtime: node
            scaffold-args: ""
          # The cloudflare entry scaffolds `api` only; later Runtime tickets widen it.
          - pm: pnpm
            runtime: cloudflare
            scaffold-args: "--apps api --runtime cloudflare"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Scaffold a real repo (runs ${{ matrix.pm }} install)
        run: node dist/cli.mjs "$RUNNER_TEMP/generated" -y --pm ${{ matrix.pm }} ${{ matrix.scaffold-args }}
      - name: Verify the generated repo
        working-directory: ${{ runner.temp }}/generated
        run: pnpm verify
      - name: Dry-run the api Worker deploy
        if: matrix.runtime == 'cloudflare'
        working-directory: ${{ runner.temp }}/generated/apps/api
        run: pnpm exec wrangler deploy --dry-run
